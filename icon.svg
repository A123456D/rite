<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#1d130c"/>
      <stop offset="55%" stop-color="#0d0806"/>
      <stop offset="100%" stop-color="#040202"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a02c00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a02c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="74%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a1a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c23a00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c23a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#ffe0ae"/>
      <stop offset="26%" stop-color="#ff9440"/>
      <stop offset="62%" stop-color="#e33c00"/>
      <stop offset="100%" stop-color="#4a1200"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a82c00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffc880"/>
    </linearGradient>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur18" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="orb"><circle cx="256" cy="258" r="104"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="330" cy="150" rx="150" ry="110" fill="url(#neb1)" opacity="0.55"/>
  <ellipse cx="160" cy="400" rx="130" ry="100" fill="url(#neb2)" opacity="0.5"/>

  <!-- ember bloom behind the orb -->
  <circle cx="256" cy="258" r="150" fill="url(#halo)" filter="url(#blur18)"/>

  <!-- orbit ring fragments -->
  <g fill="none" stroke="#ffb060" stroke-opacity="0.4" stroke-width="2.5">
    <ellipse cx="256" cy="258" rx="196" ry="62" transform="rotate(-16 256 258)" stroke-dasharray="150 70 90 200"/>
  </g>
  <g fill="none" stroke="#ff8a3d" stroke-opacity="0.28" stroke-width="2">
    <ellipse cx="256" cy="258" rx="170" ry="46" transform="rotate(24 256 258)" stroke-dasharray="40 120 160 120"/>
  </g>

  <!-- the molten orb -->
  <circle cx="256" cy="258" r="104" fill="url(#sphere)"/>
  <g clip-path="url(#orb)">
    <g fill="none" stroke="#ffd9a0" stroke-linecap="round" filter="url(#blur3)" opacity="0.85">
      <path stroke-width="6" d="M296 178L266 214L288 250L250 282L266 320L240 350"/>
      <path stroke-width="4" d="M266 214L226 204"/>
      <path stroke-width="4" d="M250 282L210 296"/>
      <path stroke-width="3.5" d="M288 250L318 268"/>
    </g>
    <g fill="none" stroke="#ffe8c8" stroke-linecap="round" stroke-width="2.2">
      <path d="M296 178L266 214L288 250L250 282L266 320L240 350"/>
      <path d="M266 214L226 204"/>
      <path d="M250 282L210 296"/>
      <path d="M288 250L318 268"/>
    </g>
    <circle cx="196" cy="200" r="26" fill="#ffd9a0" opacity="0.32" filter="url(#blur8)"/>
    <circle cx="330" cy="338" r="64" fill="#000000" opacity="0.38" filter="url(#blur8)"/>
  </g>
  <circle cx="256" cy="258" r="104" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="7"/>
  <circle cx="256" cy="258" r="100" fill="none" stroke="rgba(255,170,90,0.25)" stroke-width="3" filter="url(#blur3)"/>

  <!-- heat gauge with a bright head -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="18"/>
  <path d="M 256 106 A 150 150 0 1 1 106 256" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round" filter="url(#blur8)" opacity="0.75"/>
  <path d="M 256 106 A 150 150 0 1 1 106 256" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="106" r="16" fill="#ffe8c8" filter="url(#blur3)"/>
  <circle cx="256" cy="106" r="9" fill="#fff3dd"/>

  <!-- sparks -->
  <g fill="#ffb060">
    <circle cx="150" cy="118" r="3" filter="url(#blur3)"/>
    <circle cx="384" cy="136" r="2.4"/>
    <circle cx="108" cy="300" r="2.2" filter="url(#blur3)"/>
    <circle cx="408" cy="318" r="3.2"/>
    <circle cx="204" cy="86" r="2"/>
    <circle cx="332" cy="84" r="2.6" filter="url(#blur3)"/>
    <circle cx="426" cy="206" r="2"/>
    <circle cx="92" cy="212" r="2.6"/>
  </g>

  <rect width="512" height="512" rx="116" fill="url(#vg)"/>
</svg>
