<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RITE · phone preview</title>
    <style>
      body {
        margin: 0;
        background: #141414;
        display: flex;
        gap: 28px;
        justify-content: center;
        align-items: flex-start;
        padding: 28px;
        flex-wrap: wrap;
      }
      .frame {
        width: 390px;
        height: 844px;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid #333;
        flex: none;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
      }
      .cap {
        color: #888;
        font: 12px/1.4 system-ui, sans-serif;
        text-align: center;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="frame"><iframe src="/" title="RITE at 390×844"></iframe></div>
      <p class="cap">RITE · 390 × 844 (iPhone-ish)</p>
    </div>
  </body>
</html>
